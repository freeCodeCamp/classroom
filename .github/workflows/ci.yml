name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check for npm lockfiles
        run: |
          if [ -n "$(git ls-files '*package-lock.json')" ]; then
            echo 'Error: found package-lock.json. Add dependencies with pnpm add.'
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check format of .env.sample
        run: docker run --rm -v "$PWD":/app -w /app dotenvlinter/dotenv-linter check --ignore-checks UnorderedKey .env.sample

      - name: Build challenge map
        run: pnpm run challenge-map

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
