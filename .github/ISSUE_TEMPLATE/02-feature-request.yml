name: Feature request
description: Suggest an idea for freeCodeCamp Classroom.
labels: ['enhancement']
body:
  - type: textarea
    attributes:
      label: Is your feature request related to a problem? Describe it.
      description: For example, "As a teacher, I cannot see [...]".
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the solution you want
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the alternatives you considered
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add other context or screenshots here.
    validations:
      required: false
