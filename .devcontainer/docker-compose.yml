name: classroom-devcontainer

services:
  db:
    ports: !reset []

  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:5-26-bookworm@sha256:f052b166a5acd0424f6213921295629efb5ee07d9ab026b7d6f4418f927730d7
    environment:
      CLASSROOM_DEVCONTAINER: 'true'
    volumes:
      - .:/workspaces/classroom:cached
    network_mode: service:db
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
