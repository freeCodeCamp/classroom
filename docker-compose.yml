name: classroom

services:
  db:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: classroom
    ports:
      - '127.0.0.1:5432:5432'
      - '127.0.0.1:1026:1026'
      - '127.0.0.1:8026:8026'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d classroom']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1026
      MP_UI_BIND_ADDR: 0.0.0.0:8026
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
